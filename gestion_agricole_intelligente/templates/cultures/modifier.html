{% extends "base/base.html" %}

{% block title %}Modifier la culture{% endblock %}

{% block content %}
<div class="container-fluid">
    {% include "components/breadcrumb.html" with section="Cultures" title="Modifier" %}
    <div class="row justify-content-center">
        <div class="col-xl-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white border-0">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-0">Modifier la culture</h5>
                            <small class="text-muted">{{ culture.nom }}</small>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <form method="post" novalidate>
                        {% csrf_token %}
                        {% include "cultures/_form.html" %}
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
