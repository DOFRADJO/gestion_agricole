{% extends "base/base.html" %}

{% block title %}Tableau de bord Agriculteur{% endblock %}

{% block content %}
<div class="container-fluid">
    <h2 class="h4 mb-3">Tableau de bord Agriculteur</h2>
    <div class="row g-3">
        <div class="col-md-6">
            <div class="card p-3 shadow-sm">
                <h6>Mes cultures</h6>
                <h3>{{ total_cultures }}</h3>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card p-3 shadow-sm">
                <h6>Recommandations</h6>
                <h3>{{ total_recommandations }}</h3>
            </div>
        </div>
    </div>
</div>

{% endblock %}
