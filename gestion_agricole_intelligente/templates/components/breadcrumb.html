<nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb bg-white rounded shadow-sm p-3 mb-0">
        <li class="breadcrumb-item">
            <a href="{% if request.user.is_authenticated %}{% if request.user.get_type_utilisateur == 'administrateur' %}{% url 'core:dashboard_admin' %}{% elif request.user.get_type_utilisateur == 'agronome' %}{% url 'core:dashboard_agronome' %}{% else %}{% url 'core:dashboard_agriculteur' %}{% endif %}{% endif %}">Accueil</a>
        </li>
        {% if section %}
            <li class="breadcrumb-item">{{ section }}</li>
        {% endif %}
        <li class="breadcrumb-item active" aria-current="page">{{ title }}</li>
    </ol>
</nav>
