{% extends "base/base.html" %}

{% block title %}Modifier observation{% endblock %}

{% block content %}
<div class="container-fluid">
    {% include "components/breadcrumb.html" with section="Observations" title="Modifier observation" %}

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {% include "observations/_form.html" %}
                <div class="mt-3 text-end">
                    <a href="{% url 'observations:liste' %}" class="btn btn-outline-secondary">Annuler</a>
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
